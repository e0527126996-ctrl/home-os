name: HOME OS quality checks

on:
  push:
    branches:
      - sync/local-home-os-2026-11-06
  pull_request:
    branches:
      - sync/local-home-os-2026-11-06
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
